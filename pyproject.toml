[project]
name = "gaggiuino_api"
version = "1.0.0"
description = "Gaggiuino REST Api Wrapper"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Alexey ALERT Rubashёff", email = "alexey.rubasheff@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["gaggiuino", "api"]
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.13.0",
    "mashumaro>=3.17",
]

[project.urls]
homepage = "https://github.com/ALERTua/gaggiuino_api"
repository = "https://github.com/ALERTua/gaggiuino_api"
documentation = "https://github.com/ALERTua/gaggiuino_api"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit-uv",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "rust-just",
    "ty",
]

[tool.ruff]
src = ["src", "test"]
extend-exclude = [
    ".idea/",
    "script/",
    "dist/",
    "images/",
    ".venv/",
]
extend-include = []
output-format = "grouped"
respect-gitignore = true

[tool.ruff.lint]
task-tags = ["TODO"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88
quote-style = "preserve"

[tool.ruff.lint.flake8-bugbear]
# The model field helper returns a dataclass field, as dataclasses.field does.
extend-immutable-calls = [
    "gaggiuino_api.models.api",
    "gaggiuino_api.models.base.api",
]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88
max-line-length = 120

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-nested-blocks = 10
max-positional-args = 3
max-public-methods = 30

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402"]

[tool.ty.src]
include = ["src", "test"]

[tool.pytest.ini_options]
minversion = "8.3.5"
pythonpath = ["src"]
addopts = "-ra -q -m 'not e2e'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "e2e: marks tests as end-to-end tests that require real network access (deselect with '-m \"not e2e\"')",
]
